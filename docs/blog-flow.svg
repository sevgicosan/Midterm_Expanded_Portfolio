<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="640" viewBox="0 0 1000 640" font-family="Calibri, Arial, sans-serif" style="display:block;margin:0 auto;background:#fff">
<title>Blog — how posts are written and read</title>
<defs>
<marker id="abh" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 L8 4.5 L0 9 z" fill="#222"/></marker>
</defs>
<text x="500" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#222">Blog — you write it, visitors read it</text>

<text x="215" y="65" text-anchor="middle" font-size="15" font-weight="bold" fill="#596239">YOU — write &amp; manage</text>
<text x="215" y="83" text-anchor="middle" font-size="13" font-style="italic" fill="#666">/admin/blogs</text>

<text x="785" y="65" text-anchor="middle" font-size="15" font-weight="bold" fill="#2B6CB0">VISITORS — read</text>
<text x="785" y="83" text-anchor="middle" font-size="13" font-style="italic" fill="#666">/blogs</text>

<g font-size="16">
<rect x="60" y="100" width="310" height="90" rx="10" fill="#EAF2FB" stroke="#2B6CB0" stroke-width="2.5"/>
<text x="215" y="128" text-anchor="middle" font-weight="bold">1 · Write a post</text>
<text x="215" y="148" text-anchor="middle" font-size="13.5">title, content, optional cover image</text>
<text x="215" y="166" text-anchor="middle" font-size="13.5">uploaded from your computer</text>
<text x="215" y="182" text-anchor="middle" font-size="12.5" font-style="italic" fill="#666">BlogAdminForm.js</text>
<line x1="215" y1="190" x2="215" y2="218" stroke="#222" stroke-width="2" marker-end="url(#abh)"/>

<rect x="60" y="220" width="310" height="80" rx="10" fill="#FFF4E6" stroke="#C05621" stroke-width="2.5"/>
<text x="215" y="250" text-anchor="middle" font-weight="bold">2 · POST /api/blogs</text>
<text x="215" y="270" text-anchor="middle" font-size="13.5">multipart form: the text + the image file</text>
<text x="215" y="288" text-anchor="middle" font-size="12.5" font-style="italic" fill="#666">app/api/blogs/route.js — handles POST and GET</text>
<line x1="215" y1="300" x2="215" y2="328" stroke="#222" stroke-width="2" marker-end="url(#abh)"/>

<rect x="60" y="330" width="310" height="110" rx="10" fill="#FFF4E6" stroke="#C05621" stroke-width="2.5"/>
<text x="215" y="358" text-anchor="middle" font-weight="bold">3 · validate + save</text>
<text x="215" y="378" text-anchor="middle" font-size="13.5">blogValidation.js checks every field</text>
<text x="215" y="397" text-anchor="middle" font-size="13.5">image → public/uploads · post → data/blogs.json</text>
<text x="215" y="416" text-anchor="middle" font-size="13.5">a unique slug becomes the post's web address</text>
<text x="215" y="432" text-anchor="middle" font-size="12.5" font-style="italic" fill="#666">existing posts are never overwritten</text>
<line x1="215" y1="440" x2="215" y2="468" stroke="#222" stroke-width="2" marker-end="url(#abh)"/>

<rect x="60" y="470" width="310" height="85" rx="10" fill="#FFF4E6" stroke="#C05621" stroke-width="2.5"/>
<text x="215" y="498" text-anchor="middle" font-weight="bold">4 · Edit anytime</text>
<text x="215" y="518" text-anchor="middle" font-size="13.5">PUT /api/blogs/[slug] — same API, updates it</text>
<text x="215" y="536" text-anchor="middle" font-size="12.5" font-style="italic" fill="#666">the slug never changes, so links keep working</text>

<line x1="370" y1="390" x2="408" y2="365" stroke="#222" stroke-width="2" marker-end="url(#abh)"/>

<rect x="405" y="300" width="190" height="120" rx="10" fill="#E8F0E4" stroke="#596239" stroke-width="2.5"/>
<text x="500" y="333" text-anchor="middle" font-weight="bold" font-size="15">data/</text>
<text x="500" y="353" text-anchor="middle" font-weight="bold" font-size="15">blogs.json</text>
<text x="500" y="376" text-anchor="middle" font-size="12.5">the single source of truth</text>
<text x="500" y="394" text-anchor="middle" font-size="12.5">+ public/uploads</text>
<text x="500" y="410" text-anchor="middle" font-size="12.5" font-style="italic" fill="#666">for cover images</text>

<line x1="595" y1="330" x2="633" y2="280" stroke="#222" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#abh)"/>

<rect x="630" y="100" width="310" height="90" rx="10" fill="#EAF2FB" stroke="#2B6CB0" stroke-width="2.5"/>
<text x="785" y="128" text-anchor="middle" font-weight="bold">1 · /blogs — card grid</text>
<text x="785" y="148" text-anchor="middle" font-size="13.5">every card: image, date, title, excerpt</text>
<text x="785" y="166" text-anchor="middle" font-size="13.5">newest post first</text>
<text x="785" y="182" text-anchor="middle" font-size="12.5" font-style="italic" fill="#666">BlogList.js</text>
<line x1="785" y1="190" x2="785" y2="218" stroke="#222" stroke-width="2" marker-end="url(#abh)"/>

<rect x="630" y="220" width="310" height="80" rx="10" fill="#EAF2FB" stroke="#2B6CB0" stroke-width="2.5"/>
<text x="785" y="250" text-anchor="middle" font-weight="bold">2 · GET /api/blogs</text>
<text x="785" y="270" text-anchor="middle" font-size="13.5">the API reads the saved posts and returns them</text>
<text x="785" y="288" text-anchor="middle" font-size="12.5" font-style="italic" fill="#666">the same route you write through</text>
<line x1="785" y1="300" x2="785" y2="328" stroke="#222" stroke-width="2" marker-end="url(#abh)"/>

<rect x="630" y="330" width="310" height="100" rx="10" fill="#EAF2FB" stroke="#2B6CB0" stroke-width="2.5"/>
<text x="785" y="358" text-anchor="middle" font-weight="bold">3 · /blogs/[slug] — one post</text>
<text x="785" y="378" text-anchor="middle" font-size="13.5">full text with the cover image beside it</text>
<text x="785" y="397" text-anchor="middle" font-size="13.5">each post has its own web address</text>
<text x="785" y="415" text-anchor="middle" font-size="12.5" font-style="italic" fill="#666">unknown slug → the 404 page</text>
</g>

<text x="500" y="610" text-anchor="middle" font-size="14" font-style="italic" fill="#666">One API and one JSON file: you write through it, visitors read from it.</text>
</svg>
