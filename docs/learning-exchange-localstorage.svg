<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="940" viewBox="0 0 1000 940" font-family="Calibri, Arial, sans-serif" style="display:block;margin:0 auto;background:#fff">
<title>Learning Exchange — LocalStorage lifecycle</title>
<defs>
<marker id="ah" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 L8 4.5 L0 9 z" fill="#222"/></marker>
<marker id="ag" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 L8 4.5 L0 9 z" fill="#596239"/></marker>
</defs>
<text x="500" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#222">Learning Exchange — everything happens inside the browser</text>

<text x="210" y="62" text-anchor="middle" font-size="14" font-weight="bold" fill="#2B6CB0">WHAT THE VISITOR SEES</text>
<text x="760" y="62" text-anchor="middle" font-size="14" font-weight="bold" fill="#C05621">BEHIND THE SCENES — React + data</text>

<g font-size="16">
<rect x="60" y="85" width="300" height="95" rx="10" fill="#EAF2FB" stroke="#2B6CB0" stroke-width="2.5"/>
<text x="210" y="115" text-anchor="middle" font-weight="bold">1 · Open / revisit the page</text>
<text x="210" y="137" text-anchor="middle" font-size="13.5">Next.js delivers the page code</text>
<text x="210" y="155" text-anchor="middle" font-size="12.5" font-style="italic" fill="#666">no data is fetched from any server</text>
<line x1="360" y1="132" x2="452" y2="132" stroke="#222" stroke-width="2" marker-end="url(#ah)"/>

<rect x="460" y="85" width="240" height="95" rx="10" fill="#FFF4E6" stroke="#C05621" stroke-width="2.5"/>
<text x="580" y="115" text-anchor="middle" font-weight="bold">2 · useEffect runs once</text>
<text x="580" y="137" text-anchor="middle" font-size="13.5">reads LocalStorage + JSON.parse</text>
<text x="580" y="155" text-anchor="middle" font-size="12.5" font-style="italic" fill="#666">learningExchangeStorage.js</text>
<line x1="700" y1="132" x2="792" y2="132" stroke="#222" stroke-width="2" marker-end="url(#ah)"/>

<rect x="740" y="85" width="220" height="95" rx="10" fill="#EAF2FB" stroke="#2B6CB0" stroke-width="2.5"/>
<text x="850" y="115" text-anchor="middle" font-weight="bold">3 · Board renders</text>
<text x="850" y="137" text-anchor="middle" font-size="13.5">every saved note appears,</text>
<text x="850" y="155" text-anchor="middle" font-size="13.5">tilted and pinned</text>
<line x1="850" y1="180" x2="850" y2="252" stroke="#222" stroke-width="2" marker-end="url(#ah)"/>

<rect x="740" y="255" width="220" height="80" rx="10" fill="#EAF2FB" stroke="#2B6CB0" stroke-width="2.5"/>
<text x="850" y="287" text-anchor="middle" font-weight="bold">· click a note</text>
<text x="850" y="309" text-anchor="middle" font-size="13.5">full text + link in a modal</text>
<text x="850" y="326" text-anchor="middle" font-size="12.5" font-style="italic" fill="#666">edit + delete live here</text>

<rect x="60" y="300" width="300" height="115" rx="10" fill="#EAF2FB" stroke="#2B6CB0" stroke-width="2.5"/>
<text x="210" y="330" text-anchor="middle" font-weight="bold">4 · “+ Suggest a Resource”</text>
<text x="210" y="352" text-anchor="middle" font-size="13.5">opens the form in a modal</text>
<text x="210" y="372" text-anchor="middle" font-size="13.5">Cancel closes it — nothing is saved</text>
<text x="210" y="392" text-anchor="middle" font-size="12.5" font-style="italic" fill="#666">RecommendationForm.js + Modal.js</text>
<line x1="210" y1="415" x2="210" y2="458" stroke="#222" stroke-width="2" marker-end="url(#ah)"/>
<line x1="360" y1="350" x2="452" y2="350" stroke="#222" stroke-width="2" marker-end="url(#ah)"/>

<rect x="460" y="295" width="240" height="125" rx="10" fill="#FFF4E6" stroke="#C05621" stroke-width="2.5"/>
<text x="580" y="323" text-anchor="middle" font-weight="bold">5 · Submit validates first</text>
<text x="580" y="344" text-anchor="middle" font-size="13">name · title · category</text>
<text x="580" y="362" text-anchor="middle" font-size="13">link shape · explanation ≥ 10 chars</text>
<text x="580" y="383" text-anchor="middle" font-size="12.5" font-style="italic" fill="#666">learningExchangeValidation.js</text>
<text x="580" y="405" text-anchor="middle" font-size="12.5" font-style="italic" fill="#666">the browser checks its own input</text>

<rect x="740" y="380" width="220" height="80" rx="10" fill="#FDECEA" stroke="#A6432C" stroke-width="2.5"/>
<text x="850" y="410" text-anchor="middle" font-weight="bold">5a · INVALID</text>
<text x="850" y="432" text-anchor="middle" font-size="13.5">red error under the field</text>
<text x="850" y="450" text-anchor="middle" font-size="13.5">nothing saved</text>
<line x1="700" y1="380" x2="740" y2="405" stroke="#A6432C" stroke-width="2" marker-end="url(#ah)"/>

<rect x="460" y="470" width="240" height="100" rx="10" fill="#E8F0E4" stroke="#596239" stroke-width="2.5"/>
<text x="580" y="498" text-anchor="middle" font-weight="bold">5b · VALID → WRITE</text>
<text x="580" y="520" text-anchor="middle" font-size="13.5">id + automatic date added,</text>
<text x="580" y="539" text-anchor="middle" font-size="13.5">whole list written back</text>
<text x="580" y="557" text-anchor="middle" font-size="12.5" font-style="italic" fill="#666">modal closes · new note pinned first</text>

<rect x="60" y="470" width="300" height="100" rx="10" fill="#FFF4E6" stroke="#C05621" stroke-width="2.5"/>
<text x="210" y="498" text-anchor="middle" font-weight="bold">6 · Edit / Delete</text>
<text x="210" y="520" text-anchor="middle" font-size="13.5">edit → form prefilled → Save changes</text>
<text x="210" y="539" text-anchor="middle" font-size="13.5">delete → confirm() → note removed</text>
<text x="210" y="557" text-anchor="middle" font-size="12.5" font-style="italic" fill="#666">updatedAt marks the note “edited”</text>

<line x1="580" y1="570" x2="580" y2="640" stroke="#596239" stroke-width="2.5" marker-end="url(#ag)"/>
<text x="600" y="612" font-size="13.5" font-style="italic" fill="#596239">WRITE (add / edit / delete)</text>
<line x1="210" y1="570" x2="310" y2="655" stroke="#596239" stroke-width="2.5" marker-end="url(#ag)"/>
<line x1="440" y1="120" x2="330" y2="655" stroke="#596239" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#ag)"/>
<text x="330" y="235" font-size="13.5" font-style="italic" fill="#596239" transform="rotate(87 330 235)"> </text>

<rect x="150" y="660" width="700" height="130" rx="10" fill="#E8F0E4" stroke="#596239" stroke-width="3"/>
<text x="500" y="693" text-anchor="middle" font-weight="bold" font-size="17">LocalStorage — the browser's built-in store</text>
<text x="500" y="718" text-anchor="middle" font-size="13.5">key: learning-exchange-recommendations · an array of all notes as JSON</text>
<text x="500" y="740" text-anchor="middle" font-size="13.5">survives refresh AND closing/reopening the browser</text>
<text x="500" y="762" text-anchor="middle" font-size="12.5" font-style="italic" fill="#666">per browser &amp; per device — the server never sees this data</text>

<text x="500" y="840" text-anchor="middle" font-size="14" font-style="italic" fill="#666">Same flow every visit: open → read → render → write on every change → persists.</text>
<text x="500" y="866" text-anchor="middle" font-size="14" font-style="italic" fill="#666">This is the client-side twin of the contact forms: validation is instant, but data stays on one device.</text>
</g>
</svg>
